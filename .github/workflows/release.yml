name: Release

# Runs on every push to main. If changesets are pending, it opens or updates a release pull request.
# When that pull request is merged, the same workflow publishes the new versions to npm.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Node 22 ships an older npm.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Build, typecheck, lint, test and validate packages
        run: npm run check

      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
